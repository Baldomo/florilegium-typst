[package]
name = "florilegium-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
plugin = ["dep:wasm-minimal-protocol"]

[dev-dependencies]
sha2 = "0.10"
wasmi = "2.0.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 3

[dependencies]
ciborium = "0.2.2"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
wasm-minimal-protocol = { version = "0.2.1", optional = true }
