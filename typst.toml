[package]
name = "florilegium"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Kevin Raymond", "Leo <@Baldomo>"]
repository = "https://github.com/Baldomo/florilegium-typst"
license = "MIT"
description = "Procedurally generated Delft-blue floral page margins."
categories = ["layout", "visualization"]
keywords = ["ornament", "margin", "flowers", "procedural", "decoration"]
compiler = "0.15.0"
exclude = [
  "core",
  "tools",
  "tests",
  "examples",
  "Makefile",
  "mise.toml",
  ".superpowers",
  ".gitignore",
]

[tool.tytanic]
tests = "tests"
